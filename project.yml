# Xcode project spec. GitHub's Macs turn this into LoonieRates.xcodeproj with:  xcodegen generate
# (No .xcodeproj is committed: this text file merges cleanly, the generated project doesn't.)
name: LoonieRates
options:
  bundleIdPrefix: com.jamierowe
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RatesKit: { path: Packages/RatesKit }
targets:
  LoonieRates:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Config/LoonieRates-Info.plist
      properties:
        CFBundleDisplayName: Loonie Rates
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierowe.loonierates
        TARGETED_DEVICE_FAMILY: "1"
        # Lets Swift call the Objective-C code in App/ObjC.
        SWIFT_OBJC_BRIDGING_HEADER: App/ObjC/LoonieRates-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - package: RatesKit

  LoonieRatesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierowe.loonierates.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: LoonieRates

schemes:
  LoonieRates:
    build:
      targets:
        LoonieRates: all
        LoonieRatesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [LoonieRates]
      targets: [LoonieRatesTests]
